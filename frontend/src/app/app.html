<header class="cabecera">
  <a routerLink="/torneos" class="logo">Gestor de Torneos</a>
  <nav>
    <a routerLink="/torneos" routerLinkActive="activo">Torneos</a>
    @if (auth.logueado()) {
        <a routerLink="/equipos" routerLinkActive="activo">Mis equipos</a>
        <button class="secundario" (click)="salir()">Cerrar sesión</button>
    } @else {
        <a routerLink="/login" routerLinkActive="activo">Entrar</a>
        <a routerLink="/registro" routerLinkActive="activo">Registrarse</a>
    }
  </nav>
</header>

<main class="contenedor">
  <router-outlet />
</main>
