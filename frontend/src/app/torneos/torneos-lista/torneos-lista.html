<div class="encabezado">
  <h2>Torneos</h2>
  @if (auth.logueado()) {
    <a routerLink="/torneos/nuevo" class="boton">+ Nuevo torneo</a>
  }
</div>

@if (error()) {
  <p class="mensaje-error">{{ error() }}</p>
}

<ul class="lista">
  @for (torneo of torneos(); track torneo.id) {
    <li>
      <a class="nombre" [routerLink]="['/torneos', torneo.id]">{{ torneo.nombre }}</a>
      <span class="formato">{{ torneo.formato | formatoTorneo }}</span>
      <span class="estado" [attr.data-estado]="torneo.estado">{{ torneo.estado | estadoTorneo }}</span>
      
    </li>
  } @empty {
    <li class="vacio">No hay torneos todavía.</li>
  }
</ul>
