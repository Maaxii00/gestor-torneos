spring.application.name=gestortorneos
spring.datasource.url=jdbc:h2:mem:tests;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
jwt.secreto=clave-solo-para-tests-con-mas-de-64-caracteres-para-que-hs512-no-proteste-xxxxx
jwt.expiracion-ms=86400000
torneos.maximo-activos=3

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.test.database.replace=none
cors.origenes-permitidos=http://localhost:4200